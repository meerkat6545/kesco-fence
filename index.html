<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>전기울타리 점검 현황</title>
    <style>
        /* 화면 위아래 양옆 하얀 여백을 완전히 없애는 마법 주문입니다 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        
        /* 지도를 화면 가로(100vw) 세로(100vh)에 꽉 차게 늘립니다 */
        #map { width: 100vw; height: 100vh; } 
    </style>
</head>
<body>
    <div id="map"></div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=00c7675cbac86671a92d4d20490327d5"></script>
    
    <script>
        // 1. 지도 중심 설정 (충북 청주시청 기준)
        var mapContainer = document.getElementById('map');
        var mapOption = { 
            center: new kakao.maps.LatLng(36.6424, 127.4890), 
            level: 7 
        };
        var map = new kakao.maps.Map(mapContainer, mapOption);

        // 2. 부적합 점검 데이터
        var inspectionData = [
            {
                lat: 36.6521,
                lng: 127.4950,
                address: "충북 청주시 청원구 우암동",
                issue: "누전차단기 미설치"
            }
        ];

        // 3. 지도에 빨간 핀(마커) 꽂기
        for (var i = 0; i < inspectionData.length; i++) {
            var marker = new kakao.maps.Marker({
                position: new kakao.maps.LatLng(inspectionData[i].lat, inspectionData[i].lng),
                map: map
            });
        }
    </script>
</body>
</html>
