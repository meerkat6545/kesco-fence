<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>전기울타리 점검 현황</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #map { width: 100vw; height: 100vh; }
        
        #searchBox {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2; 
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            font-family: 'Malgun Gothic', sans-serif;
        }
        input { padding: 8px; font-size: 14px; width: 220px; border: 1px solid #ccc; border-radius: 4px; }
        select { padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 12px; font-size: 14px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #004494; }
        
        /* 말풍선 안쪽 글씨 예쁘게 꾸미기 */
        .info-title { padding: 5px 10px; font-size: 14px; font-weight: bold; color: #333; text-align: center; }
    </style>
</head>
<body>
    <div id="searchBox">
        <b>🔍 부적합 주소 등록</b><br><br>
        <input type="text" id="addressInput" placeholder="주소 입력 (예: 청주시 사직동)">
        
        <select id="colorSelect">
            <option value="red">🔴 빨간 핀 (위험)</option>
            <option value="blue">🔵 파란 핀 (주의)</option>
        </select>
        
        <button onclick="searchAndPin()">핀 꽂기</button>
    </div>

    <div id="map"></div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=00c7675cbac86671a92d4d20490327d5&libraries=services"></script>
    
    <script>
        var mapContainer = document.getElementById('map');
        var mapOption = { center: new kakao.maps.LatLng(36.6424, 127.4890), level: 6 };
        var map = new kakao.maps.Map(mapContainer, mapOption);
        var geocoder = new kakao.maps.services.Geocoder();

        function searchAndPin() {
            var keyword = document.getElementById('addressInput').value;
            var selectedColor = document.getElementById('colorSelect').value;

            if (!keyword) {
                alert("주소를 입력해주세요!");
                return;
            }

            geocoder.addressSearch(keyword, function(result, status) {
                if (status === kakao.maps.services.Status.OK) {
                    var coords = new kakao.maps.LatLng(result[0].y, result[0].x);
                    var markerOptions = { map: map, position: coords };
                    
                    if (selectedColor === "red") {
                        var imageSrc = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png"; 
                        var imageSize = new kakao.maps.Size(31, 35); 
                        markerOptions.image = new kakao.maps.MarkerImage(imageSrc, imageSize);
                    }

                    // 1. 지도에 핀 꽂기
                    var marker = new kakao.maps.Marker(markerOptions);

                    // ⭐️ 2. 말풍선(인포윈도우) 만들기 ⭐️
                    var iwContent = '<div class="info-title">' + keyword + '</div>'; // 검색한 주소를 말풍선 안에 쏙!
                    
                    var infowindow = new kakao.maps.InfoWindow({
                        content : iwContent,
                        removable : true // x 버튼 눌러서 끌 수 있게 만들기
                    });

                    // ⭐️ 3. 핀에다가 '클릭 감지 센서' 달아주기 ⭐️
                    kakao.maps.event.addListener(marker, 'click', function() {
                        // 클릭하면 말풍선을 열어라!
                        infowindow.open(map, marker);
                    });

                    map.panTo(coords);
                    document.getElementById('addressInput').value = "";
                } else {
                    alert("정확한 주소를 찾을 수 없어요. 동/읍/면 단위까지 다시 적어보세요!");
                }
            });
        }
    </script>
</body>
</html>
