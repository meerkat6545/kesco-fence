<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>전기울타리 점검 현황</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 20px; }
        /* 지도가 들어갈 자리 배경색을 약간 회색으로 줘서 로딩 전에도 보이게 했어요 */
        #map { width: 100%; height: 800px; border-radius: 8px; background-color: #f0f0f0; } 
    </style>
</head>
<body>
    <h2>전기울타리 점검 부적합 현황지도 (충북)</h2>
    <div id="map"></div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=00c7675cbac86671a92d4d20490327d5"></script>
    
    <script>
        // 1. 지도 중심 설정 (충북 청주시청 기준)
        var mapContainer = document.getElementById('map');
        var mapOption = { 
            center: new kakao.maps.LatLng(36.6424, 127.4890), 
            level: 7 
        };
        var map = new kakao.maps.Map(mapContainer, mapOption);

        // 2. 부적합 점검 데이터
        var inspectionData = [
            {
                lat: 36.6521,
                lng: 127.4950,
                address: "충북 청주시 청원구 우암동",
                issue: "누전차단기 미설치"
            }
        ];

        // 3. 지도에 빨간 핀(마커) 꽂기
        for (var i = 0; i < inspectionData.length; i++) {
            var marker = new kakao.maps.Marker({
                position: new kakao.maps.LatLng(inspectionData[i].lat, inspectionData[i].lng),
                map: map
            });
        }
    </script>
</body>
</html>
